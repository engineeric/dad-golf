<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matchups · The Daddy Invitational</title>
  <meta name="description" content="Preview 2v2 matchups and team handicaps for The Daddy Invitational.">
  <meta name="theme-color" content="#0d1c38">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .help { margin: 0 0 14px; }
    .help summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      list-style: none;
    }
    .help summary::-webkit-details-marker { display: none; }
    .help summary::before {
      content: "i";
      display: inline-grid;
      place-items: center;
      width: 16px;
      height: 16px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      font-family: var(--serif);
      font-style: italic;
      font-size: 11px;
      letter-spacing: 0;
      text-transform: none;
    }
    .help summary:hover, .help[open] summary { color: var(--ink); }
    .help p { margin: 8px 0 0; color: var(--muted); max-width: 70ch; font-size: 15px; }

    .summary {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 22px;
    }
    .summary > div { padding: 14px 20px; }
    .summary .g { color: var(--white); }
    .summary .e { color: var(--white); text-align: right; }
    .summary strong { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
    .summary .mid { text-align: center; color: var(--muted); font-size: 13px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

    .mcard__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 2px solid var(--rule-strong);
    }
    .mcard__head h2 { margin: 0; font-family: var(--serif); font-size: 20px; }
    .mcard__body { display: grid; grid-template-columns: 1fr 1fr; }
    .pair { padding: 14px 18px 16px; display: grid; gap: 8px; align-content: start; position: relative; }
    .pair + .pair { border-left: 1px solid var(--rule); }
    .pair--red { box-shadow: inset 0 3px var(--red); }
    .pair--blue { box-shadow: inset 0 3px var(--blue); }
    .pair__label { font-size: 10px; }
    .pair__hcp { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
    .pair__hcp strong { font-size: 28px; font-variant-numeric: tabular-nums; }
    .pair__hcp .eyebrow { font-size: 9px; color: var(--muted); }
    .gets {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      border-radius: 3px;
      padding: 2px 7px;
      font-weight: 800;
      font-size: 12px;
    }
    .mcard__foot {
      padding: 12px 18px;
      background: var(--cream);
      border-top: 1px solid var(--rule);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    .mcard__foot.tba { font-weight: 400; }
    .flight { color: var(--ink); }

    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 720px) {
      .mcard__body { grid-template-columns: 1fr; }
      .pair { padding: 12px 16px 14px; }
      .pair + .pair { border-left: 0; border-top: 1px solid var(--rule); }
      .summary strong { font-size: 22px; }
      .summary > div { padding: 12px; }
    }
  </style>
</head>
<body>
  <header class="site-header"></header>
  <div class="banner"><h1>Matchup Preview</h1></div>
  <main id="app"><div class="loading">Loading players…</div></main>
  <footer class="site-footer"></footer>
  <script type="module" src="js/matchups.js"></script>
</body>
</html>
