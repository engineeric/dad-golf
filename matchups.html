<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Matchups · The Daddy Invitational</title>
  <meta name="description" content="Preview matchups, handicaps and strokes for all three rounds of The Daddy Invitational.">
  <meta name="theme-color" content="#0d1c38">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .basis { margin: -4px 0 14px; color: var(--muted); font-size: 10px; }
    .toolbar__views { display: flex; flex-wrap: wrap; gap: 10px; }
    .help { margin: 0 0 14px; }
    .help summary {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 10px;
      cursor: pointer;
      list-style: none;
    }
    .help summary::-webkit-details-marker { display: none; }
    .help summary::before {
      content: "i";
      display: inline-grid;
      place-items: center;
      width: 16px;
      height: 16px;
      border: 1.5px solid currentColor;
      border-radius: 50%;
      font-family: var(--serif);
      font-style: italic;
      font-size: 11px;
      letter-spacing: 0;
      text-transform: none;
    }
    .help summary:hover, .help[open] summary { color: var(--ink); }
    .help p { margin: 8px 0 0; color: var(--muted); max-width: 70ch; font-size: 15px; }

    /* One round at a time, with drop-downs (the default view). */
    .summary {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      margin-bottom: 22px;
    }
    .summary > div { padding: 14px 20px; }
    .summary .g { color: var(--white); }
    .summary .e { color: var(--white); text-align: right; }
    .summary strong { display: block; font-size: 26px; font-variant-numeric: tabular-nums; }
    .summary .mid { text-align: center; color: var(--muted); font-size: 13px; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; }

    .mcard__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 18px;
      border-bottom: 2px solid var(--rule-strong);
    }
    .mcard__head h2 { margin: 0; font-family: var(--serif); font-size: 20px; }
    .mcard__body { display: grid; grid-template-columns: 1fr 1fr; }
    .pair { padding: 14px 18px 16px; display: grid; gap: 8px; align-content: start; position: relative; }
    .pair + .pair { border-left: 1px solid var(--rule); }
    .pair--red { box-shadow: inset 0 3px var(--red); }
    .pair--blue { box-shadow: inset 0 3px var(--blue); }
    .pair__label { font-size: 10px; }
    .pair__hcp { display: flex; align-items: baseline; justify-content: space-between; margin-top: 4px; }
    .pair__hcp strong { font-size: 28px; font-variant-numeric: tabular-nums; }
    .pair__hcp .eyebrow { font-size: 9px; color: var(--muted); }
    .mcard__foot {
      padding: 12px 18px;
      background: var(--cream);
      border-top: 1px solid var(--rule);
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    .mcard__foot.tba { font-weight: 400; }
    .mcard__foot.bad { color: var(--fg-red); }
    .mcard__tags { display: flex; align-items: center; gap: 8px; }
    .select:disabled { opacity: 1; color: var(--ink); background-image: none; background-color: var(--cream); cursor: default; }


    /* All three rounds side by side, with player cards (optional, wide screens only). */
    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }

    .col__head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-height: 66px;
      padding: 12px 16px;
      background: var(--navy);
      border-bottom: 3px solid var(--gold);
    }
    .col__head > div:first-child { min-width: 0; }
    .col__head h2 { margin: 0; color: var(--gold); font-size: 11px; }
    .col__course { display: block; margin-top: 3px; color: rgba(255, 255, 255, 0.8); font-size: 13px; }
    .col__tools { display: flex; gap: 6px; flex: none; }
    .col__btn {
      height: 30px;
      padding: 0 10px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 3px;
      background: transparent;
      color: var(--white);
      font-size: 10px;
      cursor: pointer;
      white-space: nowrap;
    }
    .col__btn:hover { background: var(--navy-2); }
    .col__totals {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      color: var(--muted);
      font-size: 12px;
    }
    .col__totals .eyebrow { font-size: 9px; }
    .col__totals strong { display: block; color: var(--ink); font-size: 22px; font-variant-numeric: tabular-nums; }
    .col__totals .mid { text-align: center; }
    .col__totals > :last-child { text-align: right; }

    .match { padding: 12px 16px 14px; border-top: 1px solid var(--rule); }
    .match__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .match__head h3 { display: flex; align-items: center; gap: 8px; margin: 0; font-family: var(--serif); font-size: 17px; }
    .match__tags { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12px; }
    .match__row { display: grid; grid-template-columns: minmax(0, 1fr) 54px minmax(0, 1fr); gap: 6px; align-items: center; }
    .match__side { display: grid; gap: 6px; }
    .match__mid { text-align: center; color: var(--muted); font-size: 10px; }
    .match__mid .gets { padding: 3px 6px; letter-spacing: 0; white-space: nowrap; }
    .match__bad { margin: 8px 0 0; color: var(--fg-red); font-size: 13px; font-weight: 600; }
    .official { color: var(--gold); font-size: 9px; }
    .flight { color: var(--ink); }
    .gets {
      display: inline-block;
      background: var(--gold);
      color: var(--navy);
      border-radius: 3px;
      padding: 2px 7px;
      font-weight: 800;
      font-size: 12px;
    }

    /* Player cards: a slot in a match, or a candidate in the tray. */
    .pc {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
      min-height: 38px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 3px;
      background: transparent;
      color: var(--white);
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
    }
    button.pc { cursor: pointer; }
    .pc__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pc small { flex: none; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
    .pc__name small { margin-left: 6px; }
    .pc--red { background: var(--red); }
    .pc--blue { background: var(--blue); }
    .pc--empty { border: 1px dashed var(--muted); color: var(--muted); font-weight: 600; }
    .pc--moved { border-color: var(--ink); color: var(--ink); }
    .pc:disabled { background: transparent; border-color: var(--rule); color: var(--muted); cursor: not-allowed; }
    .pc:disabled .pc__label { text-decoration: line-through; }
    .pc[aria-expanded="true"], .pc.is-current, .pc:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

    .tray { margin-top: 10px; padding: 10px; border: 1px solid var(--gold); border-radius: 3px; background: var(--cream); }
    .tray__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; color: var(--muted); font-size: 10px; }
    .tray__head button { padding: 4px; border: 0; background: none; color: var(--ink); font-size: 10px; text-decoration: underline; cursor: pointer; }
    .tray__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 6px; }

    .btn:disabled { opacity: 0.4; cursor: default; }

    /* The all-rounds view needs the width, so its toggle only shows on wide screens. */
    @media (max-width: 1099px) { .segmented.view { display: none; } }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 720px) {
      .toolbar__views { width: 100%; }
      .segmented { display: flex; width: 100%; }
      .segmented button { flex: 1; padding: 0 6px; font-size: 10px; letter-spacing: 0.08em; }
      .mcard__body { grid-template-columns: 1fr; }
      .pair { padding: 12px 16px 14px; }
      .pair + .pair { border-left: 0; border-top: 1px solid var(--rule); }
      .summary strong { font-size: 22px; }
      .summary > div { padding: 12px; }
    }
  </style>
</head>
<body>
  <header class="site-header"></header>
  <div class="banner"><h1>Matchup Preview</h1></div>
  <main id="app">
    <div class="loader" role="status">
      <div class="loader__crest">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <circle cx="48" cy="48" r="42" fill="none" stroke="var(--rule)" stroke-width="3"/>
          <path d="M48 6 A42 42 0 0 1 90 48" fill="none" stroke="var(--fg-red)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M48 90 A42 42 0 0 1 6 48" fill="none" stroke="var(--fg-blue)" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span class="loader__mark">IV</span>
      </div>
      <span class="eyebrow">Loading matchups</span>
    </div>
  </main>
  <footer class="site-footer"></footer>
  <script type="module" src="js/matchups.js"></script>
</body>
</html>
