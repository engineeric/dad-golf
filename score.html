<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Keep score · The Daddy Invitational</title>
  <meta name="description" content="Hole-by-hole score entry for The Daddy Invitational.">
  <meta name="theme-color" content="#0d1c38">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/theme.css">
  <style>
    main { padding-top: 16px; }
    .score { max-width: 560px; margin: 0 auto; display: grid; gap: 12px; }

    /* Match header */
    .mh { background: var(--navy); color: var(--white); padding: 14px 16px; border-radius: var(--radius); }
    .mh > .eyebrow { color: rgba(255, 255, 255, 0.65); font-size: 10px; }
    .mh__vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; margin-top: 8px; }
    .mh__side { font-weight: 700; font-size: 16px; line-height: 1.25; min-width: 0; }
    .mh__side--blue { text-align: right; }
    .mh__abbr { display: block; font-size: 10px; letter-spacing: 0.1em; font-weight: 700; margin-top: 2px; }
    .mh__side--red .mh__abbr { color: #f09595; }
    .mh__side--blue .mh__abbr { color: #85b7eb; }
    .mh__status { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .mh__status .eyebrow { color: rgba(255, 255, 255, 0.65); font-size: 9px; }
    .mh .pill { font-size: 12px; padding: 4px 10px; }
    .mh .pill--live { background: var(--white); box-shadow: inset 0 0 0 2px currentColor; }
    .mh .pill--live.fg-red { color: var(--red); }
    .mh .pill--live.fg-blue { color: var(--blue); }
    .mh .pill--square { color: var(--navy); box-shadow: inset 0 0 0 2px var(--gold); }
    .mh .pill--halved { background: var(--gold); color: var(--navy); }
    .mh .pill--none { background: rgba(255, 255, 255, 0.12); color: var(--white); }

    /* Scorecard */
    .sc { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .sc table { border-collapse: collapse; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; }
    .sc th, .sc td { border: 1px solid var(--rule); text-align: center; height: 34px; padding: 0; position: relative; font-size: 14px; }
    .sc th { background: var(--navy); color: var(--white); font-weight: 700; font-size: 12px; height: 26px; border-color: var(--navy-2); }
    .sc .l { width: 58px; text-align: left; padding-left: 5px; font-size: 10px; letter-spacing: 0.04em; font-weight: 700; white-space: nowrap; overflow: hidden; }
    .sc tr.par td, .sc tr.hcp td { height: 24px; font-size: 12px; color: var(--muted); background: var(--cream); }
    .sc tr.par td.l, .sc tr.hcp td.l { color: var(--muted); }
    .sc tr.red td.l { background: var(--red); color: var(--white); }
    .sc tr.blue td.l { background: var(--blue); color: var(--white); }
    .sc tr.up td { height: 26px; font-size: 12px; font-weight: 700; }
    .sc td[data-hole] { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .sc .won-red { background: var(--red); color: var(--white); font-weight: 800; }
    .sc .won-blue { background: var(--blue); color: var(--white); font-weight: 800; }
    .sc .lost { color: var(--muted); }
    .sc .halved { background: rgba(204, 166, 92, 0.25); }
    .sc .up-red { background: var(--won-red); color: var(--fg-red); }
    .sc .up-blue { background: var(--won-blue); color: var(--fg-blue); }
    .sc .up-as { color: var(--ink); }
    @media (prefers-color-scheme: dark) { .sc .up-as { color: var(--gold); } }
    .sc .cur { box-shadow: inset 0 0 0 2px var(--ink); }
    .sc .pending { outline: 2px dashed var(--gold); outline-offset: -4px; }
    .sc .stroke { position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
    .sc .stroke i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold); }
    .sc .won-red .stroke i, .sc .won-blue .stroke i { background: var(--white); }
    .key { text-align: center; font-size: 12px; color: var(--muted); }
    .key i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); vertical-align: 1px; }

    /* Current hole */
    .hole { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px; }
    .hole__nav { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; }
    .hole__nav button { height: 42px; min-width: 64px; border: 1px solid var(--rule); border-radius: 3px; background: var(--surface); font-size: 14px; font-weight: 700; cursor: pointer; }
    .hole__nav button:disabled { opacity: 0.35; cursor: default; }
    .hole__title { text-align: center; }
    .hole__title strong { display: block; font-family: var(--serif); font-size: 26px; line-height: 1.1; }
    .hole__title .eyebrow { color: var(--muted); font-size: 10px; }
    .gets { display: block; width: max-content; max-width: 100%; margin: 10px auto 0; background: var(--gold); color: var(--navy); border-radius: 3px; padding: 2px 8px; font-size: 12px; font-weight: 800; }
    .pick { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 8px; margin-top: 12px; }
    .pick button { min-height: 56px; border: 2px solid transparent; border-radius: 4px; font-size: 15px; font-weight: 800; cursor: pointer; padding: 6px; line-height: 1.2; }
    .pick .r { background: var(--red); color: var(--white); }
    .pick .b { background: var(--blue); color: var(--white); }
    .pick .h { background: var(--surface); color: var(--ink); border-color: var(--gold); padding: 6px 14px; }
    .pick button[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--surface), 0 0 0 5px var(--ink); }
    .pick__hint { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; }

    .note { background: rgba(204, 166, 92, 0.15); border: 1px solid var(--gold); border-radius: var(--radius); padding: 10px 12px; font-size: 14px; }
    .sync { text-align: center; font-size: 13px; color: var(--muted); }
    .sync--warn { color: var(--gold); font-weight: 700; }
    .sync--error { color: var(--fg-red); font-weight: 700; }
    .who { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); padding: 4px 2px 0; }
    .who a, .who button { color: inherit; background: none; border: 0; padding: 0; text-decoration: underline; cursor: pointer; font-size: 13px; }

    /* Sign-in and messages */
    .panel { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; display: grid; gap: 12px; }
    .panel h2 { margin: 0; font-family: var(--serif); font-size: 24px; }
    .panel p { margin: 0; }
    .panel input { height: 46px; border: 1px solid var(--rule); border-radius: 3px; padding: 0 12px; font-size: 16px; background: var(--surface); color: var(--ink); width: 100%; }
    .panel input:focus { outline: 2px solid var(--gold); outline-offset: 1px; }
    .panel .btn { height: 46px; width: 100%; }
    .error { color: var(--fg-red); font-size: 14px; }

    @media (max-width: 720px) {
      main { padding-top: 12px; }
      .sc .l { width: 54px; padding-left: 4px; letter-spacing: 0.02em; }
    }
  </style>
</head>
<body>
  <header class="site-header"></header>
  <main id="app">
    <div class="loader" role="status">
      <div class="loader__crest">
        <svg viewBox="0 0 96 96" aria-hidden="true">
          <circle cx="48" cy="48" r="42" fill="none" stroke="var(--rule)" stroke-width="3"/>
          <path d="M48 6 A42 42 0 0 1 90 48" fill="none" stroke="var(--fg-red)" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M48 90 A42 42 0 0 1 6 48" fill="none" stroke="var(--fg-blue)" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span class="loader__mark">IV</span>
      </div>
      <span class="eyebrow">Loading scorecard</span>
    </div>
  </main>
  <footer class="site-footer"></footer>

  <script type="module" src="js/score.js"></script>
</body>
</html>
